name: CI

on:
  pull_request:
  push:
    branches:
      - main
    paths:
      - src/tf/**
      - .github/workflows/**

permissions:
  contents: read
  id-token: write

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      terraform: ${{ steps.changed-files.outputs.any_changed }}
    steps:
      - uses: actions/checkout@v7

      - name: Detect Terraform changes
        id: changed-files
        uses: tj-actions/changed-files@v47
        with:
          files: |
            src/tf/**
            .github/workflows/**

  validate:
    needs: changes
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.terraform == 'true' }}
    uses: glitchedmob/infra-gha/.github/workflows/tf-validate.yml@v0.7.4
    with:
      init-backend: false

  result:
    name: Terraform checks
    if: ${{ always() && github.event_name == 'pull_request' }}
    needs:
      - changes
      - validate
    runs-on: ubuntu-latest
    steps:
      - uses: re-actors/alls-green@05ac9388f0aebcb5727afa17fcccfecd6f8ec5fe # release/v1
        with:
          allowed-skips: validate
          jobs: ${{ toJSON(needs) }}
